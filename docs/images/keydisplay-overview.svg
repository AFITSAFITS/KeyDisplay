<svg xmlns="http://www.w3.org/2000/svg" width="768" height="456" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">KeyDisplay v1.3 输入显示与毫秒设置示意</title>
<desc id="desc">非 Windows 实机截图。左侧显示本机 S、Ctrl 加 S、鼠标左键到屏幕右下角气泡；右侧为默认1200毫秒设置示意，新事件立即更新但不保证零延时。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#eaf1f9"/></linearGradient><linearGradient id="screen" x2="1" y2="1"><stop stop-color="#dbe7f4"/><stop offset="1" stop-color="#f2f5fa"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#376cb2" stroke-width="1.6"/></marker></defs>
<rect width="1280" height="760" fill="url(#bg)"/>
<g font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" fill="#202b3b">
<text x="56" y="82" font-size="42" font-weight="700">KeyDisplay <tspan font-size="23" font-weight="400" fill="#56728f">v1.3</tspan></text>
<text x="1224" y="78" text-anchor="end" font-size="22" fill="#53647a">Windows 本机键鼠事件显示</text>
<path d="M56 110H1224" stroke="#cad4e2"/>
<text x="56" y="162" font-size="26" font-weight="600">输入事件 → 右下角气泡</text>
<rect x="56" y="186" width="690" height="275" fill="url(#screen)" stroke="#b8c8db"/>
<text x="76" y="219" font-size="18" fill="#4e6781">主屏定位示意</text>
<path d="M103 279V356" stroke="#8ea9c7" stroke-width="3"/>
<text x="122" y="304" font-size="21" fill="#4e6781">原应用继续接收输入</text>
<text x="122" y="341" font-size="21" fill="#4e6781">显示层不主动抢焦点</text>
<path d="M353 314H438V397H476" fill="none" stroke="#376cb2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="492" y="362" width="230" height="75" rx="14" fill="#181a24"/>
<text x="607" y="412" text-anchor="middle" font-size="37" font-weight="700" fill="#fff">Ctrl + S</text>
<path d="M56 493H270M293 493H506M528 493H746" stroke="#3978c4" stroke-width="2"/>
<text x="56" y="536" font-size="31" font-weight="600">S → S</text>
<text x="56" y="567" font-size="20" fill="#526378">普通按键</text>
<text x="293" y="536" font-size="31" font-weight="600">Ctrl + S</text>
<text x="293" y="567" font-size="20" fill="#526378">组合键名称</text>
<text x="528" y="536" font-size="28" font-weight="600">左键 → LMB</text>
<text x="528" y="567" font-size="20" fill="#526378">鼠标点击操作</text>
<text x="784" y="162" font-size="25" font-weight="600">托盘右键 → 设置显示时长</text>
<rect x="784" y="186" width="440" height="391" fill="#fff" stroke="#b8c4d2"/>
<rect x="785" y="187" width="438" height="50" fill="#f4f6f8"/>
<text x="802" y="220" font-size="19">KeyDisplay v1.3 — 设置（示意）</text>
<path d="M784 237H1224" stroke="#d4dce7"/>
<text x="806" y="283" font-size="23">显示时长（ms）</text>
<rect x="1068" y="257" width="132" height="42" fill="#fff" stroke="#9cadc1"/>
<text x="1134" y="287" text-anchor="middle" font-size="27">1200</text>
<text x="806" y="335" font-size="20" fill="#526378">范围：1～600000 ms</text>
<text x="806" y="371" font-size="20" fill="#526378">默认：1200 ms</text>
<text x="806" y="417" font-size="22">新事件立即更新。</text>
<text x="806" y="454" font-size="22">只设置保留时长，</text>
<text x="806" y="491" font-size="22">不设置输入采样间隔。</text>
<rect x="806" y="515" width="160" height="43" fill="#edf4ff" stroke="#376cb2"/>
<text x="886" y="544" text-anchor="middle" font-size="21" fill="#235998">保存并应用</text>
<rect x="982" y="515" width="94" height="43" fill="#f7f8fa" stroke="#bdc7d2"/>
<text x="1029" y="544" text-anchor="middle" font-size="21">关闭</text>
<path d="M56 617H1224" stroke="#cad4e2"/>
<text x="56" y="658" font-size="26" font-weight="600" fill="#235998">界面示意 · 非 Windows 实机截图</text>
<text x="56" y="696" font-size="21" fill="#526378">新事件收到即更新；显示时长只控制保留，实际显示仍受系统调度与屏幕刷新影响。</text>
</g></svg>
